
            
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pen Packaging Job Center</title>

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f0f4f8;
}
.container {
  max-width: 430px;
  margin: 35px auto;
  background: white;
  padding: 28px 22px;
  border-radius: 15px;
  box-shadow: 0 4px 18px #00000015;
}
h1 {
  text-align: center;
  color: #174a7e;
  font-size: 25px;
}
h2 {
  text-align: center;
  font-size: 19px;
  margin-bottom: 25px;
}
label {
  display: block;
  margin: 13px 0 7px;
  font-weight: bold;
}
input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 15px;
  background: #1769aa;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 17px;
  margin-top: 23px;
  cursor: pointer;
}
button:disabled {
  opacity: .6;
}
#message {
  text-align: center;
  margin-top: 15px;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div class="container">

<h1>Pen Packaging Job Center</h1>
<h2>Create Your Account</h2>

<form id="registerForm">

<label>First Name</label>
<input id="firstName" type="text"
placeholder="Enter First Name" required>

<label>Last Name</label>
<input id="lastName" type="text"
placeholder="Enter Last Name" required>

<label>Indian Phone Number</label>
<input id="phone" type="tel"
placeholder="+91XXXXXXXXXX"
pattern="(\+91)?[6-9][0-9]{9}" required>

<label>Gmail Address</label>
<input id="email" type="email"
placeholder="Enter Gmail Address"
pattern="[a-zA-Z0-9._%+-]+@gmail\.com"
required>

<label>Password</label>
<input id="password" type="password"
placeholder="Create Password"
minlength="8" required>

<button id="registerButton" type="submit">
Register Now
</button>

<p id="message"></p>

</form>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  updateProfile
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

// আপনার Firebase Configuration এখানে বসান

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.firebasestorage.app",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const button = document.getElementById("registerButton");

form.addEventListener("submit", async (e) => {

  e.preventDefault();

  const firstName =
    document.getElementById("firstName").value.trim();

  const lastName =
    document.getElementById("lastName").value.trim();

  let phone =
    document.getElementById("phone").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!email.toLowerCase().endsWith("@gmail.com")) {
    message.textContent = "Please enter a Gmail address.";
    return;
  }

  phone = phone.replace(/\s/g, "");

  if (/^[6-9][0-9]{9}$/.test(phone)) {
    phone = "+91" + phone;
  }

  if (!/^\+91[6-9][0-9]{9}$/.test(phone)) {
    message.textContent = "Enter a valid Indian phone number.";
    return;
  }

  button.disabled = true;
  button.textContent = "Creating Account...";
  message.textContent = "";

  try {

    const userCredential =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    const user = userCredential.user;

    await updateProfile(user, {
      displayName: firstName + " " + lastName
    });

    await setDoc(doc(db, "users", user.uid), {
      firstName: firstName,
      lastName: lastName,
      phone: phone,
      email: email,
      createdAt: serverTimestamp()
    });

    message.textContent =
      "Registration successful! Your account has been created.";

    form.reset();

  } catch (error) {

    message.textContent =
      "Error: " + error.message;

  } finally {

    button.disabled = false;
    button.textContent = "Register Now";

  }

});

</script> 
<div id="dashboard" style="display:none;">

<h2>Welcome to Pen Packaging Job Center</h2>

<div class="dashboard-menu">

<button onclick="showOption('Available Jobs')">
Available Jobs
</button>

<button onclick="showOption('New Work Order')">
New Work Order
</button>

<button onclick="showOption('My Orders')">
My Orders
</button>

<button onclick="showOption('Order History')">
Order History
</button>

<button onclick="showOption('Payment Details')">
Payment Details
</button>

<button onclick="showOption('My Profile')">
My Profile
</button>

<button onclick="showOption('Contact Support')">
Contact Support
</button>

<button onclick="logoutUser()">
Logout
</button>

</div>

<div id="dashboardContent"></div>

</div>

<style>
.dashboard-menu {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.dashboard-menu button {
  min-height: 75px;
  background: #174a7e;
  border-radius: 10px;
  color: white;
}
</style>

<script>
function showOption(name) {
  document.getElementById("dashboardContent")
    .innerHTML = "<h3>" + name +
    "</h3><p>This section is coming soon.</p>";
}

function logoutUser() {
  location.reload();
}
</script>


</body>
</html>
