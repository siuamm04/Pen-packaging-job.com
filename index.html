
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pen Packaging Job Center</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f0f4f8;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  background: white;
  width: 90%;
  max-width: 400px;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 4px 20px #0002;
}

h2 {
  text-align: center;
  color: #123c69;
}

p {
  text-align: center;
  color: #666;
}

input {
  width: 100%;
  padding: 13px;
  margin: 9px 0;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 13px;
  background: #1266d4;
  color: white;
  border: none;
  border-radius: 7px;
  font-size: 16px;
  margin-top: 12px;
  cursor: pointer;
}

.switch {
  color: #1266d4;
  cursor: pointer;
  font-weight: bold;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="container">

  <div id="register">
    <h2>Pen Packaging Job Center</h2>
    <p>Create Your Account</p>

    <form id="registerForm">
      <input type="text" id="name"
        placeholder="Full Name" required>

      <input type="email" id="gmail"
        placeholder="Gmail Address" required>

      <input type="password" id="password"
        placeholder="Create Password"
        minlength="8" required>

      <button type="submit">Register Now</button>
    </form>

    <p>Already have an account?
      <span class="switch"
        onclick="showLogin()">Login</span>
    </p>
  </div>

  <div id="login" class="hidden">
    <h2>Welcome Back</h2>
    <p>Login to Your Account</p>

    <form id="loginForm">
      <input type="email"
        placeholder="Gmail Address" required>

      <input type="password"
        placeholder="Password" required>

      <button type="submit">Login Now</button>
    </form>

    <p>Don't have an account?
      <span class="switch"
        onclick="showRegister()">Register Now</span>
    </p>
  </div>

</div>

<script>
function showLogin() {
  document.getElementById("register")
    .classList.add("hidden");
  document.getElementById("login")
    .classList.remove("hidden");
}

function showRegister() {
  document.getElementById("login")
    .classList.add("hidden");
  document.getElementById("register")
    .classList.remove("hidden");
}

document.getElementById("registerForm")
.addEventListener("submit", function(e) {
  e.preventDefault();
  alert("Registration form ready! Connect a secure authentication system to create your account.");
});

document.getElementById("loginForm")
.addEventListener("submit", function(e) {
  e.preventDefault();
  alert("Please connect the secure login system first.");
});
</script>

</body>
</html>
